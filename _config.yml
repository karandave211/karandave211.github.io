# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog.

# Site Settings
title: "Karan Dave | SEO & Market Research Portfolio"
locale: "en-US"
description: "BBA Student and SEO Intern specializing in Local SEO and Market Research in Ahmedabad."
url: "https://karandave211.github.io"
baseurl: "" # leave empty for github pages

# Author Settings
author:
  name: "Karan Dave"
  bio: "BBA Student & SEO Intern at Shaligram Infotech"
  location: "Ahmedabad, India"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/karandave211"

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "aqua"

# Analytics (Fixed Spacing)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-39Y9E5YXQ9"
    anonymize_ip: true

# Defaults for Posts and Pages
defaults:
  # _posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Build Settings
include: ["_pages"]
exclude:
  - Node_modules
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
