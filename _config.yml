# Site Settings
title: "Karan Dave | SEO & Market Research"
locale: "en-US"
url: "https://karandave211.github.io"
baseurl: ""

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air"

# Author Profile
author:
  name: "Karan Dave"
  bio: "SEO Intern at Shaligram Infotech | BBA Student"
  location: "Ahmedabad, India"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/karan-dave-984a883a8"

# Analytics (This must be on its own lines)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-39Y9E5YXQ9"
    anonymize_ip: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
