# Site Settings
title: "Karan Dave"
description: "SEO Intern & BBA Student Portfolio"
url: "https://karandave211.github.io"
baseurl: ""

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air" # This gives you the clean white/blue look
search: true

# Author Sidebar (This restores your photo and links)
author:
  name: "Karan Dave"
  avatar: "/assets/images/bio-photo.jpg" # Make sure your photo is in this folder!
  bio: "Digital Strategist | BBA Student"
  location: "Ahmedabad, India"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/karan-dave-984a883a8"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:davekaran955@gmail.com"

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-39Y9E5YXQ9"
    anonymize_ip: true

# Defaults (This tells Jekyll to show the sidebar on every page)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      share: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
