<style>
.back-to-top {

  bottom: 30px;
  right: 30px;
  background-color: #3498db;
  color: white;
  width: 50px;
  height: 50px;

<script>
// Back to Top Button Logic
window.addEventListener('scroll', function() {
  var backButton = document.querySelector('.back-to-top');
  if (window.scrollY > 300) {
    backButton.classList.add('show');
  } else {
    backButton.classList.remove('show');
  }
});
</script>

<!-- ============================================
SEARCH OVERLAY COMPONENT
Replaces the default search button with a sleek icon & full-screen overlay
=============================================== -->
<style>
  /* Style for the search icon in the navigation */
  .search-overlay-icon {
    cursor: pointer;
    font-size: 1.25em;
    transition: opacity 0.2s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 0.5rem; /* Add some spacing */
  }

  .search-overlay-icon:hover {
    opacity: 0.7;
    text-decoration: none;
  }

  /* Style for the full-screen overlay */
  .search-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.95);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
    opacity: 0;
    transition: visibility 0s, opacity 0.3s ease;
  }

  .search-overlay.active {
    visibility: visible;
    opacity: 1;
  }

  /* Style for the overlay close button */
  .search-overlay-close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10001;
  }

  .search-overlay-close:hover {
    transform: scale(1.1);
  }

  /* Style for the search input box */
  .search-overlay-input {
    width: 80%;
    max-width: 800px;
    padding: 20px;
    font-size: 1.5rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid white;
    color: white;
    outline: none;
    text-align: center;
    font-family: inherit;
  }

  .search-overlay-input::placeholder {
    color: #ccc;
    font-size: 1.2rem;
  }

  /* Style for the results container */
  .search-results-container {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 800px;
    max-height: 40vh;
    overflow-y: auto;
    color: white;
    text-align: left;
    background: rgba(0,0,0,0.7);
    border-radius: 8px;
    padding: 15px;
  }

  .search-results-container a {
    color: #fff;
    text-decoration: none;
    display: block;
    padding: 8px 0;
    border-bottom: 1px solid #444;
  }
  .search-results-container a:hover {
    color: #ccc;
  }
  /* Hide results container initially */
  .search-results-container {
    display: none;
  }
  .search-results-container.active {
    display: block;
  }
</style>

<div id="searchOverlay" class="search-overlay">
  <div class="search-overlay-close" id="closeSearchOverlay">&times;</div>
  <input type="text" id="searchInput" class="search-overlay-input" placeholder="Search projects, posts..." autocomplete="off">
  <div id="searchResults" class="search-results-container"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Check if we're on a site with Lunr search already configured
    const overlay = document.getElementById('searchOverlay');
    const openBtn = document.getElementById('openSearchOverlay');
    const closeBtn = document.getElementById('closeSearchOverlay');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('searchResults');

    // Create search index
    let searchIndex = null;
    let searchStore = [];

    // Fetch the search data (if it exists) - Adjust path if needed
    async function loadSearchIndex() {
      try {
        const response = await fetch('/search.json');
        if (!response.ok) {
          console.warn('Search index not found at /search.json');
          return;
        }
        const data = await response.json();
        searchStore = data;
        console.log('Search index loaded, entries:', searchStore.length);
      } catch (error) {
        console.error('Error loading search index:', error);
      }
    }

    // Function to perform search
    function performSearch(query) {
      if (!query || query.length < 2) {
        resultsContainer.innerHTML = '';
        resultsContainer.classList.remove('active');
        return;
      }

      const lowerQuery = query.toLowerCase();
      const results = searchStore.filter(item => {
        return (item.title && item.title.toLowerCase().includes(lowerQuery)) ||
               (item.content && item.content.toLowerCase().includes(lowerQuery)) ||
               (item.excerpt && item.excerpt.toLowerCase().includes(lowerQuery));
      }).slice(0, 10); // Limit to 10 results

      if (results.length > 0) {
        resultsContainer.innerHTML = results.map(result => `
          <a href="${result.url}">
            <strong>${result.title}</strong><br>
            <small>${result.excerpt ? result.excerpt.substring(0, 100) + '...' : ''}</small>
          </a>
        `).join('');
        resultsContainer.classList.add('active');
      } else {
        resultsContainer.innerHTML = '<p style="color: white; text-align: center;">No results found.</p>';
        resultsContainer.classList.add('active');
      }
    }

    // Wait for search index to load
    loadSearchIndex();

    // Create the search icon in the navigation
    const navMenu = document.querySelector('.greedy-nav');
    if (navMenu) {
      const searchIcon = document.createElement('a');
      searchIcon.innerHTML = '🔍';
      searchIcon.id = 'openSearchOverlay';
      searchIcon.className = 'search-overlay-icon';
      searchIcon.style.cursor = 'pointer';
      navMenu.appendChild(searchIcon);
    } else {
      // Fallback if greedy-nav not found
      const masthead = document.querySelector('.masthead');
      if (masthead) {
        const searchIcon = document.createElement('a');
        searchIcon.innerHTML = '🔍';
        searchIcon.id = 'openSearchOverlay';
        searchIcon.className = 'search-overlay-icon';
        masthead.appendChild(searchIcon);
      }
    }

    // Event listeners for the overlay
    if (openBtn) {
      openBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (overlay) {
          overlay.classList.add('active');
          if (searchInput) {
            setTimeout(() => { searchInput.focus(); }, 100);
          }
        }
      });
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', function() {
        if (overlay) overlay.classList.remove('active');
      });
    }

    if (searchInput) {
      searchInput.addEventListener('keyup', function(e) {
        performSearch(this.value);
      });
    }
  });
</script>
<!-- END SEARCH OVERLAY COMPONENT -->
