<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Global Mobile Optimization */
  @media screen and (max-width: 800px) {
    /* Fixes the text size and line spacing */
    body, .page__content, .archive__item-excerpt {
      font-size: 19px !important;
      line-height: 1.7 !important;
    }
    
    /* Fixes the side margins so text doesn't touch the glass */
    .wrapper, .page__inner-wrap, .archive__item {
      padding-right: 15px !important;
      padding-left: 15px !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      max-width: 100% !important;
    }

    /* Keeps titles from being too huge */
    h1, .page__title {
      font-size: 1.8rem !important;
      word-wrap: break-word !important;
    }

    /* Ensures images fit the screen width */
    img {
      max-width: 100% !important;
      height: auto !important;
    }
  }
</style>
